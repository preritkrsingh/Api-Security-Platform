server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT_MS:2000}
  cloud:
    gateway:
      httpclient:
        connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:3000}
        response-timeout: ${GATEWAY_RESPONSE_TIMEOUT_MS:5s}
      routes:
        - id: dynamic-proxy-route
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/proxy/**
        - id: protected-sample-backend
          uri: ${BACKEND_URL:http://localhost:8081}
          predicates:
            - Path=/api/**

platform:
  security:
    jwt:
      secret: ${JWT_SECRET:veyrion_dev_jwt_secret_signing_key_32_characters_minimum}
    rate-limiter:
      prefer-redis: ${GATEWAY_PREFER_REDIS:true}

control-plane:
  url: ${CONTROL_PLANE_URL:http://localhost:8082}
  cache-ttl-ms: ${GATEWAY_CONFIG_CACHE_TTL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
