# ==============================================================================
# Local Zero-Dependency Profile (H2 in PostgreSQL Compatibility Mode)
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=local
# ==============================================================================
server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: shopnex-demo-api-local

  datasource:
    url: jdbc:h2:mem:shopnex_local_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
