services:
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-api_security_platform}
      - POSTGRES_USER=${POSTGRES_USER:-platform_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-platform_dev_password}
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform_admin} -d ${POSTGRES_DB:-api_security_platform} || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  control-plane:
    build:
      context: ./control-plane
      dockerfile: Dockerfile
    container_name: control-plane
    environment:
      - CONTROL_PLANE_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-api_security_platform}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-platform_admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-platform_dev_password}
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - ALLOW_LOCAL_DEVELOPMENT=true
    ports:
      - "${CONTROL_PLANE_PORT:-8082}:8082"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8082/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      - GATEWAY_PORT=8080
      - CONTROL_PLANE_URL=http://control-plane:8082
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GATEWAY_CONNECT_TIMEOUT_MS=3000
      - GATEWAY_RESPONSE_TIMEOUT_MS=5000
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      control-plane:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: platform-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - control-plane
      - gateway

volumes:
  postgres-data:
    name: platform-postgres-data
  redis-data:
    name: platform-redis-data

networks:
  default:
    name: platform-network

